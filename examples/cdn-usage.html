<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>drp-datepicker — CDN usage</title>
</head>
<body>
  <p>Pick a date (Nepali-first):</p>
  <drp-datepicker id="dp"></drp-datepicker>

  <p>Pick a date (English-first):</p>
  <drp-datepicker id="dp2" type="ad"></drp-datepicker>

  <!-- Once published to npm, this resolves automatically via unpkg. -->
  <script src="https://unpkg.com/drp-datepicker/dist/drp-datepicker.global.js"></script>
  <script>
    document.getElementById('dp').addEventListener('change', (e) => console.log(e.detail));
    document.getElementById('dp2').addEventListener('change', (e) => console.log(e.detail));
  </script>
</body>
</html>
